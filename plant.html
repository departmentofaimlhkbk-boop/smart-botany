<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant Details</title>

  <!-- Lightbox CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css" rel="stylesheet" />

  <!-- Custom styles -->
  <link rel="stylesheet" href="styles.css">

  <style>
    .plant-container {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 900px;
      margin: 40px auto;
    }

    .plant-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .plant-table {
      width: 100%;
      border-collapse: collapse;
    }

    .plant-table th, .plant-table td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }

    .plant-table th {
      background: #f2f2f2;
      width: 30%;
    }

    .images {
      display: flex;
      gap: 12px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .images img {
      width: 200px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      cursor: pointer;
    }

    .page-header {
      text-align: center;
      margin: 20px auto 30px auto;
    }

    .college-logo {
      width: 80px;
      margin-bottom: 10px;
    }

    .main-title {
      font-size: 28px;
      font-weight: bold;
    }

    .project-title {
      font-size: 18px;
      color: #2e7d32;
    }

    .main-page-container {
      text-align: center;
      margin-bottom: 20px;
    }

    .main-page-btn {
      padding: 8px 16px;
      background: #2e7d32;
      color: white;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }

    .credits {
      text-align: center;
      font-family: "Times New Roman", Times, serif;
      font-size: 13px;
      color: #555;
      margin: 30px 15px 10px 15px;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header class="page-header">
    <img src="college-image.png" alt="College Logo" class="college-logo">
    <h1 class="main-title">HKBK College Of Engineering</h1>
    <h2 class="project-title">🌱 Campus Greenery Information Management System - CGIMS</h2>
  </header>

  <!-- Home button -->
  <div class="main-page-container">
    <a href="index.html" class="main-page-btn">🏠 Home Page</a>
  </div>

  <!-- ✅ IMPORTANT: ID MUST MATCH plant.js -->
  <div class="plant-container" id="plant-card">
    Loading plant details...
  </div>

  <!-- Credits -->
  <footer class="credits">
    Designed and developed by Jaffer H, Kishan K, Gowthami N, and Khushi M under the guidance of
    Dr Tabassum Ara-Hod & Prof. Bharath V-Asst. Prof., Dept. of AIML
  </footer>

  <!-- ✅ CORRECT SCRIPTS (VERY IMPORTANT ORDER) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="plant.js"></script>

</body>
</html>
